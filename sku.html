<!DOCTYPE html>
<html>
<head>
    <title>SKU Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="receipt.html">Receipt Generator</a>
        <a href="sku.html">SKU Generator</a>
    </nav>

    <div class="container">
        <div class="section">
            <h2>Create SKU</h2>

            <label>Category:
                <select id="category">
                    <option value="">-- Select --</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Food">Food</option>
                    <option value="Beverage">Beverage</option>
                </select>
            </label>

            <label>Product Name:
                <input type="text" id="product_input" placeholder="e.g., Laptop">
            </label>

            <label>Stock Quantity:
                <input type="number" id="quantity" placeholder="e.g., 100">
            </label>

            <button onclick="generateSKU()">Generate SKU</button>
            <button onclick="clearSKU()">Clear</button>
        </div>

        <div class="section">
            <h2>SKU Code</h2>
            <div id="sku_output"></div>
        </div>
    </div>

    <script>
    function generateSKU() {
        const category = document.getElementById("category").value;
        const product_name = document.getElementById("product_input").value;
        const stock_qty = document.getElementById("quantity").value;

        if (!category || !product_name || !stock_qty) {
            document.getElementById("sku_output").innerHTML = "<p style='color: red;'>Please fill in all fields</p>";
            return;
        }

        const sku = category.substring(0, 3).toUpperCase() + "-" + product_name.substring(0, 4).toUpperCase() + "-" + stock_qty;

        const html = `<h3>${sku}</h3>
        <p>Category Code: ${category.substring(0, 3).toUpperCase()}</p>
        <p>Product Code: ${product_name.substring(0, 4).toUpperCase()}</p>
        <p>Stock Quantity: ${stock_qty}</p>`;

        document.getElementById("sku_output").innerHTML = html;
    }

    function clearSKU() {
        document.getElementById("category").value = "";
        document.getElementById("product_input").value = "";
        document.getElementById("quantity").value = "";
        document.getElementById("sku_output").innerHTML = "";
    }
    </script>
</body>
</html>
