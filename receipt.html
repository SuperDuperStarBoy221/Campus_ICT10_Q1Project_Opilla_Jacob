<!DOCTYPE html>
<html>
<head>
    <title>Receipt Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="receipt.html">Receipt Generator</a>
        <a href="sku.html">SKU Generator</a>
    </nav>

    <div class="container">
        <div class="section">
            <h2>Select Items</h2>
            <label><input type="checkbox" id="item1" value="250"> Chicken - ₱250.00</label>
            <label><input type="checkbox" id="item2" value="180"> Beef - ₱180.00</label>
            <label><input type="checkbox" id="item3" value="150"> Fish - ₱150.00</label>
            <label><input type="checkbox" id="item4" value="120"> Vegetables - ₱120.00</label>
            <label><input type="checkbox" id="item5" value="95"> Rice - ₱95.00</label>

            <button onclick="createOrder()">Generate Receipt</button>
            <button onclick="clearReceipt()">Clear</button>
        </div>

        <div class="section">
            <h2>Receipt</h2>
            <div id="show"></div>
        </div>
    </div>

    <script>
    function createOrder() {
        const item1 = document.getElementById("item1");
        const item2 = document.getElementById("item2");
        const item3 = document.getElementById("item3");
        const item4 = document.getElementById("item4");
        const item5 = document.getElementById("item5");

        const subtotal = (parseFloat(item1.value) * item1.checked +
                         parseFloat(item2.value) * item2.checked +
                         parseFloat(item3.value) * item3.checked +
                         parseFloat(item4.value) * item4.checked +
                         parseFloat(item5.value) * item5.checked);

        const tax = subtotal * 0.12;
        const total = subtotal + tax;

        const html = `<h3>RECEIPT</h3>
        <p>Subtotal: ₱${subtotal.toFixed(2)}</p>
        <p>VAT (12%): ₱${tax.toFixed(2)}</p>
        <hr>
        <p><strong>TOTAL: ₱${total.toFixed(2)}</strong></p>`;

        document.getElementById("show").innerHTML = html;
    }

    function clearReceipt() {
        document.getElementById("item1").checked = false;
        document.getElementById("item2").checked = false;
        document.getElementById("item3").checked = false;
        document.getElementById("item4").checked = false;
        document.getElementById("item5").checked = false;
        document.getElementById("show").innerHTML = "";
    }
    </script>
</body>
</html>
